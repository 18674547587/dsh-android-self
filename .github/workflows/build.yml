name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "npm 上的 dsh 版本"
        default: "0.2.2-rc.1"
      node_version:
        description: "Node 版本（dsh 0.2.2 要求 >=24.9）"
        default: "24.22.2"

jobs:
  # 第一阶段：必须在 arm64 原生机器上做（rootfs 里的 node/proot 要真跑起来验证）
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      DSH_VER: ${{ github.event.inputs.dsh_version || '0.2.2-rc.1' }}
      NODE_VER: ${{ github.event.inputs.node_version || '24.22.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: 1) 构建 Ubuntu rootfs + Node + dsh
        run: sudo -E bash scripts/build-rootfs.sh
        env:
          DSH_VER: ${{ env.DSH_VER }}
          NODE_VER: ${{ env.NODE_VER }}

      - name: 2) 编译静态 proot（termux fork）
        run: sudo -E bash scripts/build-proot.sh

      - name: 3) 上传运行时产物
        uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: dist/
          retention-days: 7
          compression-level: 0

  # 第二阶段：x86_64 标准 runner（arm64 runner 没有 Android SDK 的 aapt2/build-tools）
  apk:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 4) 取回运行时
        uses: actions/download-artifact@v4
        with:
          name: runtime
          path: dist/

      - name: 5) 装配 assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/proot
          cp dist/rootfs.tar.gz app/src/main/assets/rootfs.tar.gz
          cp dist/proot app/src/main/assets/proot/proot
          chmod +x app/src/main/assets/proot/proot
          ls -lh app/src/main/assets app/src/main/assets/proot
          du -sh app/src/main/assets

      - name: 6) JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 7) Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 8) 构建 APK
        run: gradle :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: 9) 校验产物
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -lh "$APK"
          sha256sum "$APK" | tee apk.sha256

      - name: 10) 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-self-apk
          path: |
            app/build/outputs/apk/release/*.apk
            apk.sha256
          retention-days: 14
