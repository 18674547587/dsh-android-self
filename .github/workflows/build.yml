name: build-apk

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "npm 上的 dsh 版本"
        default: "0.2.2-rc.1"
      node_version:
        description: "Node 版本（dsh 0.2.2 要求 >=24.9）"
        default: "24.22.2"

jobs:
  # 第一阶段：必须在 arm64 原生机器上做（rootfs 里的 node/proot 要真跑起来验证）
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      DSH_VER: ${{ github.event.inputs.dsh_version || '0.2.2-rc.1' }}
      NODE_VER: ${{ github.event.inputs.node_version || '24.22.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: 1) 构建 Ubuntu rootfs + Node + dsh
        run: sudo -E bash scripts/build-rootfs.sh
        env:
          DSH_VER: ${{ env.DSH_VER }}
          NODE_VER: ${{ env.NODE_VER }}

      - name: 2) 编译静态 proot（termux fork）
        run: sudo -E bash scripts/build-proot.sh

      - name: 2.5) 冒烟测试：模拟 Android 老版本 seccomp
        run: |
          set -euo pipefail
          # rootfs 里全是 root 属主（含 700 的 /root），解压和运行都要 sudo
          sudo rm -rf /tmp/rt && sudo mkdir -p /tmp/rt
          sudo tar -xzf dist/rootfs.tar.gz -C /tmp/rt
          sudo -E env OUT="$PWD/dist" ROOT=/tmp/rt bash scripts/smoke-proot.sh

      - name: 3) 上传运行时产物
        uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: dist/
          retention-days: 7
          compression-level: 0

  # 第二阶段：x86_64 标准 runner（arm64 runner 没有 Android SDK 的 aapt2/build-tools）
  apk:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 4) 取回运行时
        uses: actions/download-artifact@v4
        with:
          name: runtime
          path: dist/

      - name: 5) 装配 assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/proot
          cp dist/rootfs.tar.gz app/src/main/assets/rootfs.bin   # 不能叫 .gz：aapt2 会自动解压并改名
          cp dist/proot app/src/main/assets/proot/proot
          chmod +x app/src/main/assets/proot/proot
          ls -lh app/src/main/assets app/src/main/assets/proot
          du -sh app/src/main/assets

      - name: 6) JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 7) Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 7.5) 注入 build 号（App 日志里能看出装的是哪个包）
        run: |
          sed -i "s/versionName = \"0.2.0\"/versionName = \"0.2.0-build${{ github.run_number }}\"/" app/build.gradle.kts
          grep -n versionName app/build.gradle.kts

      - name: 8) 构建 APK
        run: gradle :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: 9) 校验产物
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -lh "$APK"
          sha256sum "$APK" | tee apk.sha256

      - name: 10) 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-self-apk
          path: |
            app/build/outputs/apk/release/*.apk
            apk.sha256
          retention-days: 14

      - name: 12) 上传到 S3 网关（VPS 侧直接取用，免下载 300MB）
        continue-on-error: true
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_AK: ${{ secrets.S3_AK }}
          S3_SK: ${{ secrets.S3_SK }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          BUILD_NO: ${{ github.run_number }}
        run: |
          python3 -m pip install --quiet boto3
          python3 - <<'PYEOF'
          import os, boto3
          from boto3.s3.transfer import TransferConfig
          from botocore.config import Config
          from botocore.config import Config as BotoConfig
          s3 = boto3.client('s3',
              endpoint_url=os.environ['S3_ENDPOINT'],
              aws_access_key_id=os.environ['S3_AK'],
              aws_secret_access_key=os.environ['S3_SK'],
              config=BotoConfig(signature_version='s3v4', s3={'addressing_style': 'path'},
                                retries={'max_attempts': 10, 'mode': 'standard'},
                                read_timeout=120, connect_timeout=20))
          src = 'app/build/outputs/apk/release/app-release.apk'
          # 32MB/4 并发在 GitHub runner 上实测 503（Worker 处理不过来），改 8MB/1 并发 + 多重试
          cfg = TransferConfig(multipart_threshold=8*1024*1024,
                               multipart_chunksize=8*1024*1024, max_concurrency=1)
          for key in (f"apk/dsh-self-build{os.environ['BUILD_NO']}.apk", "apk/dsh-self-latest.apk"):
              s3.upload_file(src, os.environ['S3_BUCKET'], key,
                  ExtraArgs={'ContentType': 'application/vnd.android.package-archive'}, Config=cfg)
              h = s3.head_object(Bucket=os.environ['S3_BUCKET'], Key=key)
              print('uploaded', key, h['ContentLength'])
          PYEOF

      - name: 11) 发布到 Release（artifact 下载被限速，改走 release asset）
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DSH 自建版 build ${{ github.run_number }}
          body: |
            dsh 0.2.2-rc.1 · Node 24.22.2 · Ubuntu 24.04 rootfs · 静态 proot
            SHA256 见 apk.sha256
          files: |
            app/build/outputs/apk/release/*.apk
            apk.sha256
          draft: false
          prerelease: true
